name: Podcast quotidien

on:
  schedule:
    - cron: '15 8 * * *'  # Apres le lever du soleil a Berck toute l'annee
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests

      - name: Install Real-ESRGAN
        if: vars.ENHANCE_PODCAST_VIDEO == '1'
        run: |
          curl -L -o /tmp/realesrgan.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip -q /tmp/realesrgan.zip -d /tmp/realesrgan
          chmod +x /tmp/realesrgan/realesrgan-ncnn-vulkan
          echo "/tmp/realesrgan" >> "$GITHUB_PATH"

      - name: Generate podcast
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_daily_podcast.py

      - name: Generate podcast video
        env:
          ENHANCE_PODCAST_FRAMES: ${{ vars.ENHANCE_PODCAST_VIDEO }}
        run: python scripts/generate_podcast_video.py

      - name: Commit podcast
        run: |
          git config user.name "KiteBerck Bot"
          git config user.email "bot@berck.info"
          git add podcast/today.mp3 podcast/today.mp4 podcast/video_frames/manifest.json podcast/tts/
          git diff --cached --quiet || git commit -m "Podcast $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
